<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GoldSrc MDL Viewer</title>
<style>
:root{--bg:#f1efe9;--panel:#fbfaf7;--ink:#1f2328;--mute:#6b7076;--line:#d9d5ca;--acc:#b8860b;--accink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--panel:#1d2024;--ink:#e8e6e1;--mute:#9aa0a6;--line:#33373d;--acc:#e0a526;--accink:#16130a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15171a;--panel:#1d2024;--ink:#e8e6e1;--mute:#9aa0a6;--line:#33373d;--acc:#e0a526;--accink:#16130a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{-webkit-text-size-adjust:100%;overscroll-behavior:none;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
h1{font:600 16px/1 Georgia,"Times New Roman",serif;margin:0;letter-spacing:.2px}
button,select,input[type=file]{font:inherit}
.btn{background:var(--acc);color:var(--accink);border:0;border-radius:6px;padding:7px 14px;font-weight:600;cursor:pointer;min-height:36px;-webkit-tap-highlight-color:transparent}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#fname{color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:50vw}
main{flex:1;min-height:0;display:flex}
#view{flex:1;position:relative;min-width:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
#drop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;pointer-events:none;color:var(--mute)}
#drop b{display:block;color:var(--ink);font:600 20px Georgia,serif;margin-bottom:6px}
#view.over{outline:3px dashed var(--acc);outline-offset:-8px}
aside{width:300px;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:12px 14px}
aside h2{font:600 13px Georgia,serif;margin:16px 0 6px;color:var(--mute)}
aside h2:first-child{margin-top:0}
label{display:flex;align-items:center;gap:8px;margin:5px 0}
label span{min-width:76px;color:var(--mute)}
select,input[type=range]{flex:1;min-width:0}
select{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:4px}
.row{display:flex;gap:8px;align-items:center}
dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0}
dt{color:var(--mute)}dd{margin:0;text-align:right}
#tex{display:flex;flex-wrap:wrap;gap:8px}
#tex figure{margin:0;width:84px;font-size:11px;color:var(--mute);word-break:break-all}
#tex canvas{width:84px;height:auto;max-height:84px;object-fit:contain;border:1px solid var(--line);background:repeating-conic-gradient(#8884 0 25%,#0000 0 50%) 0 0/10px 10px}
#err{color:#c0392b;margin-top:8px;display:none}
#tg{display:none}
body.hide aside{display:none}
@media (max-width:760px){
header{gap:8px;padding:8px 10px}
#tg{display:inline-block}
main{flex-direction:column}
#view{min-height:35%}
aside{width:100%;max-height:46%;border-left:0;border-top:1px solid var(--line);-webkit-overflow-scrolling:touch}
select{min-height:36px;font-size:16px}
input[type=range]{min-height:32px}
input[type=checkbox]{width:20px;height:20px}
label{margin:8px 0}
.btn.ghost{min-height:40px}
#fname{max-width:100%;flex-basis:100%;order:5}
#drop b{font-size:18px}
}
</style>
</head>
<body>
<header>
 <h1>GoldSrc MDL Viewer</h1>
 <label class="btn" id="open" for="file" style="margin:0;display:inline-flex;align-items:center">Open .mdl</label>
 <button class="btn ghost" id="tg">Panel</button>
 <input type="file" id="file" accept="*/*" style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none">
 <span id="fname">No file loaded</span>
</header>
<main>
 <div id="view"><canvas id="cv"></canvas>
  <div id="drop"><div><b>Tap “Open .mdl” or drop a file here</b>Half-Life / Counter-Strike 1.6 model (IDST, version 10)<br>Touch: drag to rotate · pinch to zoom · two fingers to pan<br>Mouse: left = rotate · right/Shift = pan · wheel = zoom</div></div></div>
 <aside>
  <div id="err"></div>
  <h2>Animation</h2>
  <label><span>Sequence</span><select id="seq"></select></label>
  <label><span>Frame</span><input type="range" id="frame" min="0" max="0" step="1" value="0"></label>
  <label><span>Speed</span><input type="range" id="speed" min="0.1" max="3" step="0.1" value="1"></label>
  <div class="row"><button class="btn ghost" id="play">Pause</button><span id="fl" style="color:var(--mute)"></span></div>
  <h2>Display</h2>
  <div id="bp"></div>
  <label><span>Skin</span><select id="skin"></select></label>
  <label><span>Camera</span><select id="cam"><option value="free">Free orbit</option><option value="fps">First person</option></select></label>
  <div class="row"><button class="btn ghost" id="fit">Center model</button></div>
  <label><span>Background</span><input type="color" id="bgc" value="#2b2f36"></label>
  <label><input type="checkbox" id="wire"> Wireframe</label>
  <label><input type="checkbox" id="grid" checked> Grid</label>
  <h2>Info</h2>
  <dl id="info"></dl>
  <h2>Texture</h2>
  <div id="tex"></div>
 </aside>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const cv=$('cv'),view=$('view');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
const scene=new THREE.Scene();scene.background=new THREE.Color('#2b2f36');
const cam=new THREE.PerspectiveCamera(50,1,1,5000);
scene.add(new THREE.HemisphereLight(0xffffff,0x555566,0.85));
const dl=new THREE.DirectionalLight(0xffffff,0.6);dl.position.set(1,2,1.5);scene.add(dl);
const gridH=new THREE.GridHelper(200,20,0x888888,0x555555);scene.add(gridH);
const root=new THREE.Group();root.rotation.x=-Math.PI/2;scene.add(root);

let M=null,meshes=[],world=[],playing=true,frame=0,seqIdx=0,dirty=true;
const orb={th:0.8,ph:1.2,d:120,t:new THREE.Vector3()};
let fps=false,fitSz=50;const fo={y:0,p:0};
function fitView(){
 if(!M)return;computePose();skinMeshes();
 let a=[1e9,1e9,1e9],b=[-1e9,-1e9,-1e9],any=false;
 for(const o of meshes){if(!o.visible)continue;const p=o.geometry.attributes.position.array;
  for(let i=0;i<p.length;i+=3)for(let k=0;k<3;k++){const v=p[i+k];if(v<a[k])a[k]=v;if(v>b[k])b[k]=v;}any=true;}
 if(!any)return;
 const sz=Math.max(Math.hypot(b[0]-a[0],b[1]-a[1],b[2]-a[2]),10);fitSz=sz;
 orb.t.set((a[0]+b[0])/2,(a[2]+b[2])/2,-(a[1]+b[1])/2);orb.d=sz*1.3;
 cam.near=fps?0.5:sz/100;cam.far=sz*50;cam.updateProjectionMatrix();
 gridH.scale.setScalar(sz/100);gridH.position.y=a[2];
}
function setCam(m){fps=m==='fps';cam.fov=fps?75:50;fo.y=0;fo.p=0;cam.near=fps?0.5:Math.max(0.1,fitSz/100);cam.updateProjectionMatrix();gridH.visible=!fps&&$('grid').checked;}

/* ---------- Parser ---------- */
function parse(buf){
 const dv=new DataView(buf),L=true;
 const i32=o=>dv.getInt32(o,L),f32=o=>dv.getFloat32(o,L),u8=o=>dv.getUint8(o),i16=o=>dv.getInt16(o,L),u16=o=>dv.getUint16(o,L);
 const str=(o,n)=>{let s='';for(let i=0;i<n;i++){const c=u8(o+i);if(!c)break;s+=String.fromCharCode(c)}return s};
 if(buf.byteLength<244)throw new Error('File is too small.');
 const id=i32(0);
 if(id===0x51534449)throw new Error('This is an IDSQ (sequence group) file and contains no model.');
 if(id!==0x54534449)throw new Error('Not a GoldSrc MDL file (missing IDST header).');
 if(i32(4)!==10)throw new Error('Only MDL version 10 (GoldSrc) is supported.');
 const H={name:str(8,64),min:[88,92,96].map(f32),max:[100,104,108].map(f32),bbmin:[112,116,120].map(f32),bbmax:[124,128,132].map(f32),
  nb:i32(140),bi:i32(144),nseq:i32(164),si:i32(168),nsg:i32(172),nt:i32(180),ti:i32(184),nskinref:i32(192),nfam:i32(196),ski:i32(200),nbp:i32(204),bpi:i32(208)};
 const bones=[];
 for(let i=0;i<H.nb;i++){const o=H.bi+i*112;
  bones.push({name:str(o,32),parent:i32(o+32),val:[0,1,2,3,4,5].map(k=>f32(o+64+k*4)),sc:[0,1,2,3,4,5].map(k=>f32(o+88+k*4))});}
 const tex=[];
 for(let i=0;i<H.nt;i++){const o=H.ti+i*80,w=i32(o+68),h=i32(o+72),ix=i32(o+76),fl=i32(o+64);
  const rgba=new Uint8Array(w*h*4),pal=ix+w*h,masked=!!(fl&0x40);
  for(let p=0;p<w*h;p++){const c=u8(ix+p);rgba[p*4]=u8(pal+c*3);rgba[p*4+1]=u8(pal+c*3+1);rgba[p*4+2]=u8(pal+c*3+2);rgba[p*4+3]=(masked&&c===255)?0:255;}
  tex.push({name:str(o,64),w,h,rgba,masked});}
 const skins=[];
 for(let f=0;f<H.nfam;f++){const r=[];for(let k=0;k<H.nskinref;k++)r.push(i16(H.ski+(f*H.nskinref+k)*2));skins.push(r);}
 const bps=[];let tris=0;
 for(let b=0;b<H.nbp;b++){const o=H.bpi+b*76,nm=i32(o+64),mi=i32(o+72),models=[];
  for(let j=0;j<nm;j++){const mo=mi+j*112;
   const m={name:str(mo,64),nmesh:i32(mo+72),meshi:i32(mo+76),nv:i32(mo+80),vinfo:i32(mo+84),vi:i32(mo+88),nn:i32(mo+92),ninfo:i32(mo+96),ni:i32(mo+100)};
   m.verts=new Float32Array(m.nv*3);m.vb=new Uint8Array(m.nv);
   for(let v=0;v<m.nv;v++){m.verts[v*3]=f32(m.vi+v*12);m.verts[v*3+1]=f32(m.vi+v*12+4);m.verts[v*3+2]=f32(m.vi+v*12+8);m.vb[v]=u8(m.vinfo+v);}
   m.norms=new Float32Array(m.nn*3);m.nb=new Uint8Array(m.nn);
   for(let v=0;v<m.nn;v++){m.norms[v*3]=f32(m.ni+v*12);m.norms[v*3+1]=f32(m.ni+v*12+4);m.norms[v*3+2]=f32(m.ni+v*12+8);m.nb[v]=u8(m.ninfo+v);}
   m.meshes=[];
   for(let k=0;k<m.nmesh;k++){const eo=m.meshi+k*20,ti=i32(eo+4),sref=i32(eo+8);
    const sv=[],sn=[],uv=[],idx=[];let p=ti;
    const sc=tex.length?0:1;
    for(;p+2<=buf.byteLength;){let n=i16(p);p+=2;if(n===0)break;const fan=n<0;n=Math.abs(n);const base=sv.length;
     for(let q=0;q<n;q++){sv.push(i16(p));sn.push(i16(p+2));uv.push(i16(p+4),i16(p+6));p+=8;}
     for(let q=0;q<n-2;q++){if(fan)idx.push(base,base+q+1,base+q+2);else if(q&1)idx.push(base+q+1,base+q,base+q+2);else idx.push(base+q,base+q+1,base+q+2);}}
    tris+=idx.length/3;m.meshes.push({sref,sv,sn,uv,idx});}
   models.push(m);}
  bps.push({name:str(o,64),models});}
 const seqs=[];
 for(let i=0;i<H.nseq;i++){const o=H.si+i*176;
  seqs.push({name:str(o,32),fps:f32(o+32)||30,loop:!!(i32(o+36)&1),nf:Math.max(1,i32(o+56)),anim:i32(o+124),grp:i32(o+156)});}
 return {H,bones,tex,skins,bps,seqs,tris,u8,i16,u16};
}

/* ---------- Animation ---------- */
function angQ(a){
 let s=Math.sin(a[2]*.5),c=Math.cos(a[2]*.5),sy=s,cy=c;
 s=Math.sin(a[1]*.5);c=Math.cos(a[1]*.5);const sp=s,cp=c;
 s=Math.sin(a[0]*.5);c=Math.cos(a[0]*.5);const sr=s,cr=c;
 return new THREE.Quaternion(sr*cp*cy-cr*sp*sy,cr*sp*cy+sr*cp*sy,cr*cp*sy-sr*sp*cy,cr*cp*cy+sr*sp*sy);
}
function chan(base,bone,ch,f){
 const off=M.u16(base+bone*12+ch*2);if(!off)return 0;
 let p=base+bone*12+off,k=f,guard=0;
 while(M.u8(p+1)<=k&&guard++<512){const t=M.u8(p+1);if(!t)break;k-=t;p+=2+M.u8(p)*2;}
 const valid=M.u8(p);
 return M.i16(p+2+(valid>k?k:Math.max(0,valid-1))*2);
}
function localPose(seq,f){
 return M.bones.map((b,i)=>{const v=b.val.slice();
  if(seq&&seq.grp===0)for(let c=0;c<6;c++)v[c]+=chan(seq.anim,i,c,f)*b.sc[c];
  return {p:new THREE.Vector3(v[0],v[1],v[2]),q:angQ([v[3],v[4],v[5]])};});
}
function computePose(){
 const seq=M.seqs[seqIdx];let a;
 if(!seq||seq.grp!==0)a=localPose(null,0);
 else{const n=seq.nf,f0=Math.floor(frame)%n,t=frame-Math.floor(frame);
  let f1=f0+1;if(f1>=n)f1=seq.loop?0:n-1;
  a=localPose(seq,f0);
  if(t>0&&f1!==f0){const b=localPose(seq,f1);a.forEach((x,i)=>{x.p.lerp(b[i].p,t);x.q.slerp(b[i].q,t);});}}
 world=[];
 a.forEach((x,i)=>{const m=new THREE.Matrix4().compose(x.p,x.q,new THREE.Vector3(1,1,1));
  const par=M.bones[i].parent;world[i]=par>=0?new THREE.Matrix4().multiplyMatrices(world[par],m):m;});
}
function skinMeshes(){
 for(const o of meshes){if(!o.visible)continue;
  const {m,src,srcN}=o.userData,pos=o.geometry.attributes.position.array,nor=o.geometry.attributes.normal.array;
  for(let i=0;i<src.length;i++){
   const v=src[i],e=world[m.vb[v]]?.elements;if(!e)continue;
   const x=m.verts[v*3],y=m.verts[v*3+1],z=m.verts[v*3+2];
   pos[i*3]=e[0]*x+e[4]*y+e[8]*z+e[12];pos[i*3+1]=e[1]*x+e[5]*y+e[9]*z+e[13];pos[i*3+2]=e[2]*x+e[6]*y+e[10]*z+e[14];
   const n=srcN[i],en=world[m.nb[n]]?.elements;if(!en)continue;
   const nx=m.norms[n*3],ny=m.norms[n*3+1],nz=m.norms[n*3+2];
   nor[i*3]=en[0]*nx+en[4]*ny+en[8]*nz;nor[i*3+1]=en[1]*nx+en[5]*ny+en[9]*nz;nor[i*3+2]=en[2]*nx+en[6]*ny+en[10]*nz;}
  o.geometry.attributes.position.needsUpdate=true;o.geometry.attributes.normal.needsUpdate=true;
  o.geometry.computeBoundingSphere();}
}

/* ---------- Build scene ---------- */
let mats=[];
function build(){
 while(root.children.length){const c=root.children.pop();c.geometry?.dispose();}
 meshes=[];mats.forEach(m=>{m.map?.dispose();m.dispose()});mats=[];
 M.tex.forEach(t=>{const d=new THREE.DataTexture(t.rgba,t.w,t.h,THREE.RGBAFormat);
  d.wrapS=d.wrapT=THREE.RepeatWrapping;d.minFilter=d.magFilter=THREE.LinearFilter;d.generateMipmaps=false;d.needsUpdate=true;
  mats.push(new THREE.MeshLambertMaterial({map:d,side:THREE.DoubleSide,alphaTest:t.masked?0.5:0,transparent:false}));});
 const fallback=new THREE.MeshLambertMaterial({color:0x9aa0a6,side:THREE.DoubleSide});mats.push(fallback);
 M.fallback=fallback;
 M.bps.forEach((bp,bi)=>bp.models.forEach((m,mi)=>m.meshes.forEach(ms=>{
  const n=ms.sv.length,g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(n*3),3));
  g.setAttribute('normal',new THREE.BufferAttribute(new Float32Array(n*3),3));
  const uv=new Float32Array(n*2),ti=M.skins[0]?.[ms.sref],t=M.tex[ti]||M.tex[0];
  for(let i=0;i<n;i++){uv[i*2]=t?ms.uv[i*2]/t.w:0;uv[i*2+1]=t?ms.uv[i*2+1]/t.h:0;}
  g.setAttribute('uv',new THREE.BufferAttribute(uv,2));g.setIndex(ms.idx);
  const o=new THREE.Mesh(g,fallback);o.frustumCulled=false;
  o.userData={m,src:ms.sv,srcN:ms.sn,ms,bi,mi,rawUV:ms.uv};
  o.visible=mi===0;root.add(o);meshes.push(o);})));
 applySkin(0);
}
function applySkin(f){
 for(const o of meshes){const ms=o.userData.ms,ti=M.skins[f]?.[ms.sref],t=M.tex[ti];
  o.material=t?mats[ti]:M.fallback;
  if(t){const uv=o.geometry.attributes.uv.array,r=o.userData.rawUV;
   for(let i=0;i<uv.length/2;i++){uv[i*2]=r[i*2]/t.w;uv[i*2+1]=r[i*2+1]/t.h;}o.geometry.attributes.uv.needsUpdate=true;}
  o.material.wireframe=$('wire').checked;}
 dirty=true;
}

/* ---------- UI ---------- */
function showErr(t){const e=$('err');e.textContent=t;e.style.display=t?'block':'none';}
function loadBuf(buf,name){
 try{showErr('');M=parse(buf);}catch(e){M=null;showErr(e instanceof RangeError?'The file is corrupt or not a valid GoldSrc MDL (read past end of data).':e.message);return;}
 $('fname').textContent=name;$('drop').style.display='none';
 build();
 const H=M.H;
 $('seq').innerHTML=M.seqs.map((s,i)=>`<option value="${i}">${i}: ${s.name||'seq'+i}${s.grp?' (external file)':''}</option>`).join('');
 seqIdx=0;frame=0;setSeq(0);
 $('skin').innerHTML=Array.from({length:Math.max(1,M.skins.length)},(_,i)=>`<option value="${i}">Skin ${i}</option>`).join('');
 $('bp').innerHTML='';
 M.bps.forEach((bp,bi)=>{if(bp.models.length<2&&bi>0&&false)return;
  const l=document.createElement('label');l.innerHTML=`<span>${bp.name||'Body '+bi}</span><select data-bp="${bi}">${bp.models.map((m,j)=>`<option value="${j}">${j}: ${(m.name||'model').replace(/[<>&]/g,'')}</option>`).join('')}<option value="-1">Hidden</option></select>`;
  $('bp').appendChild(l);});
 $('bp').querySelectorAll('select').forEach(s=>s.onchange=()=>{const b=+s.dataset.bp,v=+s.value;
  meshes.forEach(o=>{if(o.userData.bi===b)o.visible=o.userData.mi===v;});dirty=true;});
 fitView();
 const nvert=M.bps.reduce((a,b)=>a+(b.models[0]?.nv||0),0);
 $('info').innerHTML=[['Name',H.name||name],['Bones',H.nb],['Sequences',H.nseq],['Body parts',H.nbp],['Textures',H.nt],['Skin families',H.nfam],['Triangles',M.tris]].map(([a,b])=>`<dt>${a}</dt><dd>${String(b).replace(/[<>&]/g,'')}</dd>`).join('');
 const tx=$('tex');tx.innerHTML='';
 if(!M.tex.length)tx.textContent='This model has no embedded textures (they are usually in the "...T.mdl" file).';
 M.tex.forEach(t=>{const f=document.createElement('figure'),c=document.createElement('canvas');c.width=t.w;c.height=t.h;
  c.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(t.rgba),t.w,t.h),0,0);
  f.appendChild(c);f.appendChild(document.createTextNode(`${t.name} ${t.w}×${t.h}`));tx.appendChild(f);});
}
function setSeq(i){seqIdx=i;frame=0;const s=M.seqs[i];
 $('frame').max=s?Math.max(0,s.nf-1):0;$('frame').value=0;dirty=true;}
$('seq').onchange=e=>setSeq(+e.target.value);
$('frame').oninput=e=>{playing=false;$('play').textContent='Play';frame=+e.target.value;dirty=true;};
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Pause':'Play';};
$('skin').onchange=e=>applySkin(+e.target.value);
$('wire').onchange=()=>{mats.forEach(m=>m.wireframe=$('wire').checked);dirty=true;};
$('grid').onchange=e=>{gridH.visible=e.target.checked&&!fps;};
$('bgc').oninput=e=>{scene.background=new THREE.Color(e.target.value);};
$('file').addEventListener('click',e=>{e.target.value='';});
$('cam').onchange=e=>setCam(e.target.value);
$('fit').onclick=()=>fitView();
$('tg').onclick=()=>{document.body.classList.toggle('hide');};
$('file').onchange=e=>{const f=e.target.files[0];if(f)f.arrayBuffer().then(b=>loadBuf(b,f.name));};
['dragover','dragenter'].forEach(t=>view.addEventListener(t,e=>{e.preventDefault();view.classList.add('over');}));
['dragleave','drop'].forEach(t=>view.addEventListener(t,e=>{e.preventDefault();view.classList.remove('over');}));
view.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)f.arrayBuffer().then(b=>loadBuf(b,f.name));});

/* ---------- Camera controls ---------- */
const ptr=new Map();let pinch=0;
function panBy(dx,dy){const k=orb.d*0.0015,r=new THREE.Vector3().setFromMatrixColumn(cam.matrix,0),u=new THREE.Vector3().setFromMatrixColumn(cam.matrix,1);
 orb.t.addScaledVector(r,-dx*k).addScaledVector(u,dy*k);}
function zoomBy(f){if(fps){cam.fov=Math.min(110,Math.max(30,cam.fov/f));cam.updateProjectionMatrix();}else orb.d=Math.max(1,orb.d/f);}
function two(){const [a,b]=[...ptr.values()];return{d:Math.hypot(a.x-b.x,a.y-b.y),x:(a.x+b.x)/2,y:(a.y+b.y)/2};}
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptr.size===2)pinch=two();});
const up=e=>{ptr.delete(e.pointerId);pinch=ptr.size===2?two():0;};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('pointermove',e=>{const p=ptr.get(e.pointerId);if(!p)return;
 const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
 if(ptr.size>=2){const n=two();if(pinch&&pinch.d>0){zoomBy(n.d/pinch.d);panBy(n.x-pinch.x,n.y-pinch.y);}pinch=n;return;}
 if(e.buttons&2||e.shiftKey){panBy(dx,dy);}
 else if(fps){fo.y+=dx*0.004;fo.p=Math.max(-1.2,Math.min(1.2,fo.p-dy*0.004));}
 else{orb.th-=dx*0.008;orb.ph=Math.min(3.1,Math.max(0.05,orb.ph-dy*0.008));}});
cv.addEventListener('wheel',e=>{e.preventDefault();if(fps){cam.fov=Math.min(110,Math.max(30,cam.fov+e.deltaY*0.05));cam.updateProjectionMatrix();}else orb.d*=Math.exp(e.deltaY*0.001);},{passive:false});

/* ---------- Loop ---------- */
function resize(){const w=view.clientWidth,h=view.clientHeight;
 if(cv.width!==Math.floor(w*devicePixelRatio)||cv.height!==Math.floor(h*devicePixelRatio)){
  renderer.setPixelRatio(devicePixelRatio);renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}}
let last=performance.now();
function tick(now){
 requestAnimationFrame(tick);resize();
 const dt=Math.min(0.1,(now-last)/1000);last=now;
 if(M){const s=M.seqs[seqIdx];
  if(playing&&s&&s.grp===0&&s.nf>1){frame+=dt*s.fps*(+$('speed').value);
   if(s.loop)frame%=s.nf;else frame=Math.min(frame,s.nf-1);
   $('frame').value=Math.floor(frame);dirty=true;}
  if(dirty){computePose();skinMeshes();dirty=false;
   $('fl').textContent=s?`${Math.floor(frame)+1}/${s.nf} · ${s.fps.toFixed(0)} fps`:'';}}
 const sp=Math.sin(orb.ph);
 cam.position.set(orb.t.x+orb.d*sp*Math.sin(orb.th),orb.t.y+orb.d*Math.cos(orb.ph),orb.t.z+orb.d*sp*Math.cos(orb.th));
 if(fps){cam.position.set(0,0,0);cam.lookAt(Math.cos(fo.p)*Math.cos(fo.y),Math.sin(fo.p),Math.cos(fo.p)*Math.sin(fo.y));}
 else cam.lookAt(orb.t);
 cam.updateMatrix();
 renderer.render(scene,cam);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
